<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
{{STYLE_CSS}}
  </style>
</head>
<body>
  <main id="panel" class="panel" aria-label="播放控制">
    <header class="track">
      <div class="artwork">
        <img id="artworkImage" alt="" />
        <span id="artworkFallback" aria-hidden="true">♫</span>
      </div>
      <div class="track-info">
        <div id="title" class="title" tabindex="0">暂无播放</div>
        <div id="artist" class="artist" tabindex="0">当前没有播放内容</div>
        <div id="sourceRow" class="source-row" hidden>
          <span class="source-mark" aria-hidden="true"><img id="sourceIcon" alt="" hidden /><svg id="sourceFallback" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13M9 8l11-2"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></span>
          <span id="source" class="source"></span>
        </div>
      </div>
      <div class="actions" role="group" aria-label="播放操作">
        <button id="previous" class="icon-button" type="button" aria-label="上一首" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="skip-triangle" d="M18.1 5.2c.8-.5 1.9.1 1.9 1.1v11.4c0 1-1.1 1.6-1.9 1.1l-8.5-5.7a1.3 1.3 0 0 1 0-2.2l8.5-5.7Z"/><path d="M5 5.5v13"/></svg>
        </button>
        <button id="playPause" type="button" aria-label="播放" disabled>
          <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.6c0-.95 1.05-1.5 1.83-.97l9 6.18c.82.56.82 1.82 0 2.38l-9 6.18C9.05 19.9 8 19.35 8 18.4V5.6Z" /></svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M8 5.5v13m8-13v13" /></svg>
        </button>
        <button id="next" class="icon-button" type="button" aria-label="下一首" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="skip-triangle" d="M5.9 5.2C5.1 4.7 4 5.3 4 6.3v11.4c0 1 1.1 1.6 1.9 1.1l8.5-5.7a1.3 1.3 0 0 0 0-2.2L5.9 5.2Z"/><path d="M19 5.5v13"/></svg>
        </button>
      </div>
    </header>

    <section class="timeline" aria-label="播放进度">
      <input id="seek" type="range" min="0" max="1000" value="0" disabled aria-label="播放位置" />
      <div class="time-labels"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
    </section>
  </main>
  <div id="metadataTooltip" class="metadata-tooltip" role="tooltip" hidden></div>
  <script>
{{APP_JS}}
  </script>
</body>
</html>
