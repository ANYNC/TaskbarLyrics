<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
{{STYLE_CSS}}
  </style>
</head>
<body>
  <div id="layout" class="layout">
    <div class="shell">
      <button id="cover" class="cover" type="button" aria-label="展开播放控制" aria-expanded="false">
        <span id="coverFallback" class="cover-fallback">N</span>
        <img id="coverImage" class="cover-image" alt="" />
        <img id="coverImageNext" class="cover-image" alt="" />
        <span class="cover-interaction" aria-hidden="true">
          <svg class="cover-action-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="m5 11 7-6 7 6M5 19l7-6 7 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
      </button>
      <div class="cover-gap" aria-hidden="true"></div>
      <div class="lyrics-pane">
        <div id="lyricsLayer" class="lyrics-layer">
          <div id="viewport" class="viewport">
            <div id="track" class="track">
              <div id="currentLine" class="line current-line">
                <span class="line-text-viewport">
                  <span class="line-text-stack">
                    <span id="currentLineText" class="line-text line-text-base">TaskbarLyrics started</span>
                    <span id="currentLineScanText" class="line-text line-text-scan" aria-hidden="true">TaskbarLyrics started</span>
                  </span>
                </span>
              </div>
              <div id="nextLine" class="line next-line">
                <span class="line-text-viewport">
                  <span class="line-text-stack">
                    <span id="nextLineText" class="line-text line-text-base">Waiting for lyrics...</span>
                    <span id="nextLineScanText" class="line-text line-text-scan" aria-hidden="true">Waiting for lyrics...</span>
                  </span>
                </span>
              </div>
              <div id="incomingLine" class="line next-line incoming-line">
                <span class="line-text-viewport">
                  <span class="line-text-stack"><span id="incomingLineText" class="line-text line-text-base"> </span></span>
                </span>
              </div>
              <div id="incomingTranslationPair" class="incoming-translation-pair" aria-hidden="true">
                <div id="incomingTranslationOriginalLine" class="line current-line">
                  <span class="line-text-viewport">
                    <span class="line-text-stack">
                      <span id="incomingTranslationOriginalText" class="line-text line-text-base"> </span>
                      <span id="incomingTranslationOriginalScanText" class="line-text line-text-scan" aria-hidden="true"> </span>
                    </span>
                  </span>
                </div>
                <div id="incomingTranslationLine" class="line translation-line">
                  <span class="line-text-viewport">
                    <span class="line-text-stack">
                      <span id="incomingTranslationText" class="line-text line-text-base"> </span>
                    </span>
                  </span>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div id="spectrumLayer" class="spectrum-layer" aria-hidden="true">
          <div class="spectrum">
            <span style="--i:0"></span>
            <span style="--i:1"></span>
            <span style="--i:2"></span>
            <span style="--i:3"></span>
            <span style="--i:4"></span>
            <span style="--i:5"></span>
            <span style="--i:6"></span>
            <span style="--i:7"></span>
            <span style="--i:8"></span>
            <span style="--i:9"></span>
            <span style="--i:10"></span>
            <span style="--i:11"></span>
            <span style="--i:12"></span>
            <span style="--i:13"></span>
            <span style="--i:14"></span>
            <span style="--i:15"></span>
            <span style="--i:16"></span>
            <span style="--i:17"></span>
            <span style="--i:18"></span>
            <span style="--i:19"></span>
            <span style="--i:20"></span>
          </div>
        </div>
      </div>
    </div>
    <section id="floatingPanel" class="floating-panel" aria-label="播放控制">
      <div class="floating-panel-track">
        <span id="panelTitle" class="floating-panel-title">暂无播放</span>
        <span id="panelArtist" class="floating-panel-artist">当前没有播放内容</span>
      </div>
      <div class="floating-panel-controls">
        <div class="floating-panel-actions" role="group" aria-label="播放操作">
          <button id="panelPrevious" class="panel-icon-button" type="button" aria-label="上一首" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path class="skip-triangle" d="M18.1 5.2c.8-.5 1.9.1 1.9 1.1v11.4c0 1-1.1 1.6-1.9 1.1l-8.5-5.7a1.3 1.3 0 0 1 0-2.2l8.5-5.7Z"/><path d="M5 5.5v13"/></svg>
          </button>
          <button id="panelPlayPause" class="panel-icon-button panel-play-button" type="button" aria-label="播放" disabled>
            <svg id="panelPlayIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.6c0-.95 1.05-1.5 1.83-.97l9 6.18c.82.56.82 1.82 0 2.38l-9 6.18C9.05 19.9 8 19.35 8 18.4V5.6Z" /></svg>
            <svg id="panelPauseIcon" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M8 5.5v13m8-13v13" /></svg>
          </button>
          <button id="panelNext" class="panel-icon-button" type="button" aria-label="下一首" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path class="skip-triangle" d="M5.9 5.2C5.1 4.7 4 5.3 4 6.3v11.4c0 1 1.1 1.6 1.9 1.1l8.5-5.7a1.3 1.3 0 0 0 0-2.2L5.9 5.2Z"/><path d="M19 5.5v13"/></svg>
          </button>
        </div>
        <input id="panelSeek" class="panel-seek" type="range" min="0" max="1000" value="0" disabled aria-label="播放位置" />
        <span id="panelElapsed" class="panel-time">0:00</span>
        <span id="panelDuration" class="panel-time">4:49</span>
      </div>
    </section>
  </div>

  <script>
{{APP_JS}}
  </script>
</body>
</html>
